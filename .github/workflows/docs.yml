name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'InteractiveReadLine/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let the active deployment finish. If other runs are pending, GitHub Actions keeps only the newest one,
# which then deploys after the active run completes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool update -g docfx

      # DocFX compiles the library to extract API metadata, so restore and build the project first. DocFX
      # also reads the XML documentation generated by this build.
      - name: Build the library
        run: dotnet build InteractiveReadLine/InteractiveReadLine.csproj --configuration Release

      - name: Build the documentation
        run: docfx docs/docfx.json --warningsAsErrors

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
